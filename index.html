<!doctype html><html lang='es'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#10151b'><link rel='manifest' href='manifest.json'><title>Taller CyP</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#f5f7fa;background:#0d1116}*{box-sizing:border-box}body{margin:0;background:#0d1116}.app{max-width:760px;margin:auto;min-height:100vh;padding:18px}.hero{background:linear-gradient(145deg,#161e26,#080b0f);border:1px solid #29323c;border-radius:24px;padding:22px;margin-bottom:18px}.cyp-logo{display:block;width:100%;height:auto;margin:2px auto 0}.cyp-logo text{font-family:Arial Black,Arial,sans-serif;font-style:italic;font-weight:900}.cyp-logo .tag{font-family:Arial,sans-serif;font-style:normal;font-weight:600;letter-spacing:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn,.card{border:1px solid #2b3540;background:#161d25;border-radius:17px;padding:18px;color:#fff}.btn{font-weight:700;text-align:left;font-size:16px}.primary{background:#e92327;border-color:#e92327}.wide{grid-column:1/-1}.screen{display:none}.screen.active{display:block}.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}.back{background:#202832;border:0;color:#fff;border-radius:12px;padding:10px 14px}.field{margin:10px 0}.field label{display:block;color:#aeb7c1;font-size:12px;margin-bottom:6px}input,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid #34404d;background:#0e141a;color:#fff;font-size:16px}textarea{min-height:80px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.items{margin-top:15px}.item{display:grid;grid-template-columns:1fr 100px 42px;gap:8px;margin:8px 0}.small{padding:10px}.total{font-size:24px;font-weight:800;text-align:right;margin:18px 0}.list .card{margin:10px 0}.muted{color:#aeb7c1;font-size:13px}.actions{display:flex;gap:10px}.actions button{flex:1}.danger{background:#e92327}.footer{color:#7f8994;text-align:center;font-size:11px;margin:24px 0}button{cursor:pointer}
</style></head><body><main class='app'>
<section id='home' class='screen active'><div class='hero'><svg class='cyp-logo' viewBox='0 0 1000 260' role='img' aria-label='Taller CyP Servicio Automotriz'><defs><linearGradient id='silver' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#fff'/><stop offset='.38' stop-color='#d8d8d8'/><stop offset='.62' stop-color='#fff'/><stop offset='1' stop-color='#595959'/></linearGradient><linearGradient id='red' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#ff1515'/><stop offset='.45' stop-color='#d40000'/><stop offset='1' stop-color='#480000'/></linearGradient></defs><text x='35' y='145' font-size='150' fill='url(#silver)' stroke='#bdbdbd' stroke-width='2'>Taller</text><text x='555' y='145' font-size='150' fill='url(#red)' stroke='#ff4b4b' stroke-width='2'>CyP</text><path d='M90 172 H905' stroke='#f10d18' stroke-width='8'/><text class='tag' x='190' y='225' font-size='27' fill='#d9d9d9'>SERVICIO AUTOMOTRIZ</text></svg></div><div class='grid'><button class='btn primary' onclick="show('new')">＋ Nueva OT</button><button class='btn' onclick="show('search')">⌕ Buscar vehículo</button><button class='btn' onclick="show('clients')">👤 Clientes</button><button class='btn' onclick="show('vehicles')">🚘 Vehículos</button><button class='btn' onclick="show('open')">▤ OT abiertas</button><button class='btn' onclick="show('history')">↶ Historial</button><button class='btn wide' onclick="show('maintenance')">🔧 Próximas mantenciones</button></div></section>
<section id='new' class='screen'><div class='top'><button class='back' onclick="show('home')">‹</button><h2>Nueva Orden de Trabajo</h2></div><form id='otForm'><div class='field'><label>Cliente</label><input id='cliente' value=''></div><div class='row'><div class='field'><label>Vehículo</label><input id='vehiculo'></div><div class='field'><label>Año</label><input id='anio' inputmode='numeric'></div></div><div class='row'><div class='field'><label>Patente / PPU</label><input id='ppu'></div><div class='field'><label>VIN</label><input id='vin'></div></div><div class='row'><div class='field'><label>OT Nº</label><input id='ot' readonly></div><div class='field'><label>Fecha</label><input id='fecha' type='date'></div></div><div class='field'><label>Kilometraje</label><input id='kms' inputmode='numeric'></div><h3>Repuestos / servicios</h3><div id='items' class='items'></div><button type='button' class='btn wide' onclick='addItem()'>＋ Agregar ítem</button><div class='field'><label>Observaciones</label><textarea id='obs'></textarea></div><div class='field'><label>Próxima mantención (km)</label><input id='proxima' inputmode='numeric'></div><div class='total'>Total: <span id='total'>$0</span></div><div class='actions'><button type='button' class='btn' onclick='saveOT(false)'>Guardar</button><button type='button' class='btn primary' onclick='saveOT(true)'>Guardar y generar OT</button></div></form></section>
<section id='history' class='screen'><div class='top'><button class='back' onclick="show('home')">‹</button><h2>Historial</h2></div><div id='historyList' class='list'></div></section>
<section id='search' class='screen'><div class='top'><button class='back' onclick="show('home')">‹</button><h2>Buscar vehículo</h2></div><div class='field'><input id='q' placeholder='Patente, cliente o vehículo' oninput='renderSearch()'></div><div id='searchList' class='list'></div></section>
<section id='clients' class='screen'><div class='top'><button class='back' onclick="show('home')">‹</button><h2>Clientes</h2></div><div class='field'><input id='clientQ' placeholder='Buscar cliente' oninput='renderClients()'></div><div id='clientList' class='list'></div></section><section id='clientDetail' class='screen'><div class='top'><button class='back' onclick="show('clients')">‹</button><h2 id='clientDetailTitle'>Cliente</h2></div><div id='clientSummary'></div><div id='clientOrders' class='list'></div></section>
<section id='vehicles' class='screen'><div class='top'><button class='back' onclick="show('home')">‹</button><h2>Vehículos</h2></div><div id='vehicleList' class='list'></div></section>
<section id='open' class='screen'><div class='top'><button class='back' onclick="show('home')">‹</button><h2>OT abiertas</h2></div><div class='card'>Las OT guardadas quedan en el historial. Puedes ampliar estados en una próxima versión.</div></section>
<section id='maintenance' class='screen'><div class='top'><button class='back' onclick="show('home')">‹</button><h2>Próximas mantenciones</h2></div><div id='maintenanceList' class='list'></div></section>
<div class='footer'>Taller CyP · Registro privado en este dispositivo</div></main><script>
const money=n=>'$'+Math.round(n||0).toLocaleString('es-CL');
function rawdb(){try{return JSON.parse(localStorage.getItem('cyp_ots')||'[]')}catch(e){return []}}
function normalizeOTs(rows){let groups=new Map(),noOt=[];(Array.isArray(rows)?rows:[]).forEach((o,idx)=>{o=o||{};let ot=String(o.ot??'').trim();if(!ot){noOt.push(o);return}let key=ot.toLowerCase();if(!groups.has(key)){groups.set(key,{...o,items:Array.isArray(o.items)?[...o.items]:[],total:+o.total||0,_first:idx});return}let g=groups.get(key);['cliente','vehiculo','anio','ppu','vin','fecha','kms','obs','proxima'].forEach(k=>{if(!g[k]&&o[k])g[k]=o[k]});let incoming=Array.isArray(o.items)?o.items:[];g.items.push(...incoming);g.total=(+g.total||0)+(+o.total||0)});let out=[...groups.values()].map(g=>{delete g._first;if(Array.isArray(g.items)&&g.items.length){let sum=g.items.reduce((s,i)=>s+(+i.price||0),0);if(sum>0)g.total=sum}return g});return [...out,...noOt]}
const db=()=>{let raw=rawdb(),clean=normalizeOTs(raw);if(JSON.stringify(raw)!==JSON.stringify(clean))localStorage.setItem('cyp_ots',JSON.stringify(clean));return clean};
const setdb=x=>localStorage.setItem('cyp_ots',JSON.stringify(normalizeOTs(x)));
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='new')initNew();if(id==='history')renderHistory();if(id==='clients')renderClients();if(id==='vehicles')renderVehicles();if(id==='maintenance')renderMaintenance();if(id==='search')renderSearch();scrollTo(0,0)}
function initNew(){let d=db();document.getElementById('ot').value=Math.max(312,...d.map(x=>+x.ot||0))+1;document.getElementById('fecha').value=new Date().toISOString().slice(0,10);if(!document.querySelector('#items .item')){addItem('Aceite 5w30',60000);addItem('Filtro Aceite',6500);addItem('Filtro de Aire',9900);addItem('Filtro Polen',9900)}}
function addItem(name='',price=''){let div=document.createElement('div');div.className='item';div.innerHTML=`<input class='iname small' placeholder='Descripción' value="${name}"><input class='iprice small' inputmode='numeric' placeholder='$' value="${price}"><button type='button' class='back' onclick='this.parentNode.remove();calc()'>×</button>`;document.getElementById('items').appendChild(div);div.querySelector('.iprice').oninput=calc;calc()}
function calc(){let t=[...document.querySelectorAll('.iprice')].reduce((s,x)=>s+(+x.value||0),0);document.getElementById('total').textContent=money(t);return t}
function saveOT(print){let items=[...document.querySelectorAll('#items .item')].map(x=>({name:x.querySelector('.iname').value,price:+x.querySelector('.iprice').value||0})).filter(x=>x.name);let o={cliente:cliente.value,vehiculo:vehiculo.value,anio:anio.value,ppu:ppu.value.toUpperCase(),vin:vin.value.toUpperCase(),ot:+ot.value,fecha:fecha.value,kms:kms.value,items,obs:obs.value,proxima:proxima.value,total:calc()};let d=db();let i=d.findIndex(x=>String(x.ot)===String(o.ot));if(i>=0)d[i]=o;else d.unshift(o);setdb(d);alert('OT '+o.ot+' guardada');if(print)printOT(o);show('history')}
function printOT(o){let w=open('','_blank');w.document.write(`<html><head><title>OT ${o.ot}</title><style>body{font-family:Arial;padding:30px}table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid #ddd;text-align:left}.r{text-align:right}</style></head><body><h1>Taller CyP</h1><h3>Orden de Trabajo Nº ${o.ot}</h3><p><b>Cliente:</b> ${o.cliente}<br><b>Vehículo:</b> ${o.vehiculo} ${o.anio}<br><b>PPU:</b> ${o.ppu} &nbsp; <b>VIN:</b> ${o.vin}<br><b>Fecha:</b> ${o.fecha} &nbsp; <b>KMS:</b> ${o.kms}</p><table><tr><th>Detalle</th><th class='r'>Total</th></tr>${o.items.map(i=>`<tr><td>${i.name}</td><td class='r'>${money(i.price)}</td></tr>`).join('')}<tr><th>Total Neto</th><th class='r'>${money(o.total)}</th></tr></table><p><b>Observaciones:</b><br>${o.obs||'-'}</p><p><b>Próxima mantención:</b> ${o.proxima||'-'} km</p><script>print()<\/script></body></html>`);w.document.close()}
function card(o){return `<div class='card'><b>OT ${o.ot} · ${o.ppu||'Sin patente'}</b><div>${o.vehiculo||''} ${o.anio||''}</div><div class='muted'>${o.cliente||''} · ${o.fecha||''} · ${o.kms||''} km</div><div style='margin-top:8px;font-weight:800'>${money(o.total)}</div></div>`}
function renderHistory(){historyList.innerHTML=db().map(card).join('')||`<div class='card'>Aún no hay OT guardadas.</div>`}function renderSearch(){let s=(q.value||'').toLowerCase();searchList.innerHTML=db().filter(o=>JSON.stringify(o).toLowerCase().includes(s)).map(card).join('')||`<div class='card'>Sin resultados.</div>`}
function esc(s){return String(s||'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
function renderClients(){let term=((document.getElementById('clientQ')||{}).value||'').trim().toLowerCase(),m={};db().forEach(o=>{let n=(o.cliente||'').trim();if(!n)return;let k=n.toLowerCase();if(!m[k])m[k]={name:n,orders:[],total:0};m[k].orders.push(o);m[k].total+=(+o.total||0)});let rows=Object.values(m).filter(x=>x.name.toLowerCase().includes(term)).sort((a,b)=>a.name.localeCompare(b.name,'es'));clientList.innerHTML=rows.map(x=>`<div class='card' onclick="openClient('${encodeURIComponent(x.name)}')" style='cursor:pointer'><b>${esc(x.name)}</b><div class='muted'>${x.orders.length} OT · ${x.orders.map(o=>'Nº '+esc(o.ot)).join(', ')}</div><div style='margin-top:8px;font-weight:800'>Total: ${money(x.total)}</div></div>`).join('')||`<div class='card'>Sin resultados.</div>`}
function openClient(encoded){let name=decodeURIComponent(encoded),orders=db().filter(o=>(o.cliente||'').trim().toLowerCase()===name.trim().toLowerCase()).sort((a,b)=>String(b.fecha||'').localeCompare(String(a.fecha||''))),total=orders.reduce((s,o)=>s+(+o.total||0),0);document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById('clientDetail').classList.add('active');clientDetailTitle.textContent=name;clientSummary.innerHTML=`<div class='card'><div class='muted'>Resumen del cliente</div><div style='font-size:22px;font-weight:800;margin-top:6px'>${orders.length} órdenes</div><div style='font-size:24px;font-weight:900;margin-top:8px'>${money(total)}</div><div class='muted' style='margin-top:5px'>Monto total acumulado</div></div>`;clientOrders.innerHTML=orders.map(o=>`<div class='card'><b>OT Nº ${esc(o.ot)} · ${money(o.total)}</b><div>${esc(o.ppu||'Sin patente')} · ${esc(o.vehiculo||'')} ${esc(o.anio||'')}</div><div class='muted'>${esc(o.fecha||'')} · ${esc(o.kms||'')} km</div></div>`).join('');scrollTo(0,0)}
function renderVehicles(){let m={};db().forEach(o=>{if(o.ppu)m[o.ppu]=o});vehicleList.innerHTML=Object.values(m).map(o=>`<div class='card'><b>${o.ppu}</b><div>${o.vehiculo} ${o.anio}</div><div class='muted'>${o.cliente} · VIN ${o.vin}</div></div>`).join('')||`<div class='card'>Sin vehículos aún.</div>`}
function renderMaintenance(){maintenanceList.innerHTML=db().filter(o=>o.proxima).map(o=>`<div class='card'><b>${o.ppu} · ${o.vehiculo}</b><div>Próxima: ${o.proxima} km</div><div class='muted'>Último registro: ${o.kms} km</div></div>`).join('')||`<div class='card'>No hay próximas mantenciones registradas.</div>`}
</script></body></html>
